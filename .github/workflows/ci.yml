name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, presentation-v0.1, feature/workspace-execution-environment]
    # A version tag is what publishes a release. Nothing else does — a
    # branch push builds and verifies artifacts but never puts them where
    # an installed copy of AURA Hub would find them.
    tags: ['v*']
  # Release packaging has to be runnable on demand: the Windows and macOS
  # artifacts cannot be produced on the Linux machine this is developed on,
  # so their only honest source is a native runner started deliberately.
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Native release packaging. Each OS builds its REAL Tauri artifact on its
  # own runner: AppImage + deb on Linux, NSIS on Windows, .app + .dmg on
  # macOS. A compile on Linux is not a build on Windows/macOS, so nothing
  # here is cross-compiled — every artifact is produced by its native
  # toolchain, and then RUNS what it built on that same OS. A build is not a
  # run: `desktop-runtime-verify` boots the packaged service natively, checks
  # the health gate, measures the real machine, exercises the port and
  # shutdown paths, and launches the packaged shell. That is what lets
  # Windows and macOS be reported as runtime-verified instead of merely
  # compiled — and where a step genuinely cannot run, it says so rather
  # than passing quietly.
  #
  # macOS is built twice on purpose: macos-latest is Apple Silicon and
  # macos-15-intel is Intel, so each architecture is produced and tested on
  # its own hardware rather than cross-compiled and assumed.
  #
  # The Intel leg was `macos-13`, which never ran: that image was retired in
  # December 2025, and a retired label does not fail a job, it queues it
  # forever. Eight consecutive runs sat unassigned for ten hours looking
  # exactly like runner scarcity. `macos-15-intel` is the current Intel
  # image and is planned to be the last one, so this leg has a finite life;
  # when it goes, Intel coverage ends with it rather than silently pretending.
  desktop-build:
    name: Desktop packaging (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # GitHub's Ubuntu images point apt at `azure.archive.ubuntu.com`, and
      # that mirror's throughput collapses intermittently. Across eighteen
      # recent runs on nine different branches — including `main` and the
      # release tags — this one step took anywhere from 21 seconds to 85
      # minutes, and every completed instance still SUCCEEDED. The logs show
      # index files arriving at roughly 40 kB/s rather than stalling: apt is
      # progressing, just pathologically slowly.
      #
      # That makes it a runner-infrastructure problem, not a build one.
      # Nothing in this repository has been read at this point — only
      # checkout, setup-node and rust-toolchain precede it — and the Windows
      # and macOS jobs on the same commit are unaffected.
      #
      # So use Ubuntu's own HTTPS archive, which responds normally. Only the
      # Azure host is rewritten: if a future runner image stops using it,
      # this becomes a no-op instead of a silent misconfiguration. The
      # rewrite lands before the first `apt-get update`, so every later apt
      # call in this job inherits it.
      #
      # Deliberately NOT a retry loop and NOT a step timeout. A retry would
      # hide the slowness rather than remove it, and a timeout tight enough
      # to catch a hang would have failed the 85-minute run that succeeded.
      #
      # This is an EXPERIMENT, not a settled fix. One fast run proves nothing
      # against a baseline that spans 21s to 85m; the mirror change is only
      # worth keeping if it is measurably better across several runs.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The image selects mirrors through a MIRRORLIST, not a literal URI
          # in sources.list: `/etc/apt/sources.list.d/*.sources` point at
          # `file:/etc/apt/apt-mirrors.txt`, and apt resolves the real host
          # from there. Rewriting the sources files — the obvious thing, and
          # what the first version of this step did — matches nothing and
          # silently leaves apt on the Azure mirror. This is the file that
          # actually decides.
          echo "--- mirrorlist before ---"
          cat /etc/apt/apt-mirrors.txt
          sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com|https://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          echo "--- mirrorlist after ---"
          cat /etc/apt/apt-mirrors.txt

          # Refuse to run the experiment against the wrong mirror. Without
          # this the step passes, the numbers look fine, and they measure
          # Azure — which is exactly how the first attempt produced a
          # confident, meaningless result.
          if grep -q 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            echo "::error::mirrorlist still points at the Azure mirror — refusing to measure the wrong thing"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Retried because Tauri fetches its bundler tooling at build time —
      # AppRun and linuxdeploy on Linux, the NSIS binaries on Windows — and
      # GitHub's CDN intermittently drops those connections, surfacing as
      # `failed to bundle project: io: Peer disconnected`. That flake hit two
      # different platforms in three runs and says nothing about the code, so
      # it is retried rather than re-run by hand. A genuine build error still
      # fails: it simply fails three times.
      - name: Build desktop application
        shell: bash
        # The updater's signing key, passed by reference only — the value is
        # a repository secret and never appears in this file or in a log.
        #
        # This is REQUIRED, not optional: `bundle.createUpdaterArtifacts` is
        # on and `plugins.updater.pubkey` is set, and the Tauri CLI refuses to
        # build in that state without a private key ("A public key has been
        # found, but no private key"). It also verifies the pair, and fails if
        # this key does not match the configured pubkey — so a mismatched or
        # rotated key is caught at build time rather than by users whose
        # updates silently stop verifying.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if npm run tauri --workspace @aura/desktop -- build; then exit 0; fi
            echo "::warning::desktop build attempt $attempt failed; retrying"
            sleep 20
          done
          echo "::error::desktop build failed after 3 attempts"
          exit 1

      # The AppImage bundles libwayland-client.so.0 from the Ubuntu 24.04
      # runner. That copy predates wl_fixes_interface and
      # wl_display_create_queue_with_name, which the runner's own newer Mesa
      # requires — the bundled library shadows the system one at runtime and
      # aborts the WebKitWebProcess with EGL_BAD_PARAMETER, leaving a white
      # window (v0.1.0 regression). The fix is packaging-only: repack the
      # AppImage without that one library and verify. Everything after this
      # step — staging, the AppImage launch check, the release — exercises
      # the fixed artifact. The .deb needs no patch: it bundles no Wayland.
      #
      # This step RE-SIGNS, so it needs the key. Tauri CLI 2.11.x signs the
      # AppImage in place during the build; repacking it here invalidates
      # that signature, and a stale signature beside patched bytes would
      # fail verification on every Linux client as INVALID_SIGNATURE. The
      # script removes the stale signature and makes a new one over the
      # final bytes — which it can only do with a key in the environment.
      # Without these two lines it deletes the signature and fails the
      # build, which is correct but is not a release.
      - name: Patch the AppImage (Linux only)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/patch-appimage-linux.mjs

      # Native runtime verification. Linux runners have no display, so the
      # shell phase runs under a virtual one; Windows and macOS runners have
      # a real session already. Without xvfb the Linux shell phase reports
      # NOT RUNTIME VERIFIED rather than failing — but a virtual display is
      # cheap, so it is provided and the phase genuinely runs.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Runtime verification (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-runtime-verify.mjs

      - name: Runtime verification (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/desktop-runtime-verify.mjs

      - name: Stage release artifacts
        run: node scripts/stage-release-artifacts.mjs

      # The Linux download that can carry a permission bit. A browser writes
      # every download 0644 — HTTP has no field for mode, so the client picks
      # it — which means a clicked AppImage cannot execute, and a desktop with
      # nothing registered for its type hands the file back to the browser,
      # which downloads it again. Inside a tar archive the mode travels with
      # the payload, so extracting yields an AppImage that already runs.
      #
      # It runs AFTER staging deliberately: it wraps the patched, renamed,
      # signed artifact byte for byte. Wrapping what the bundler left in
      # target/ would ship bytes the release never verified. The archive is
      # not an updater target and is skipped by the manifest builder.
      - name: Build the Linux tarball
        if: runner.os == 'Linux'
        run: node scripts/build-linux-tarball.mjs

      # Installer verification. An artifact existing is not an artifact that
      # installs, so each platform installs its own and launches what the
      # installer put on disk — not what the build left in target/.
      #
      # The AppImage exercised here is the PATCHED one (see the patch step
      # above): staging copied it after the repack, so this check verifies
      # what a user downloads. It cannot prove rendering — xvfb has no GPU,
      # and software EGL succeeds even for the broken bundle, which is why
      # the v0.1.0 regression survived CI — so the real-hardware rendering
      # acceptance stays a manual step on an actual GPU machine.
      - name: Verify the .deb installs and launches (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get install -y ./dist-release/*.deb
          test -x "/usr/bin/aura-hub" || test -x "/usr/local/bin/aura-hub"
          echo "installed binary: $(command -v aura-hub)"
          xvfb-run -a env AURA_HOME="$RUNNER_TEMP/deb-home" AI_PORT=4319 aura-hub &
          for i in $(seq 1 60); do curl -sf -m 2 http://127.0.0.1:4319/health >/dev/null && break; sleep 2; done
          curl -sf -m 5 http://127.0.0.1:4319/health >/dev/null && echo "OK: installed .deb launched and its service is healthy"
          curl -sf -m 30 -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:4319/environment/scan \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);if(!s.results.node?.present)process.exit(1);console.log('OK: detection through the installed app — node',s.results.node.version,'| git',s.results.git?.version)})"
          pkill -f 'aura-hub' || true
          sudo apt-get remove -y aura-hub && echo "OK: uninstalled cleanly"

      - name: Verify the AppImage executes directly (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          chmod +x dist-release/*.AppImage
          xvfb-run -a env AURA_HOME="$RUNNER_TEMP/appimage-home" AI_PORT=4319 ./dist-release/*.AppImage &
          for i in $(seq 1 60); do curl -sf -m 2 http://127.0.0.1:4319/health >/dev/null && break; sleep 2; done
          curl -sf -m 5 http://127.0.0.1:4319/health >/dev/null && echo "OK: AppImage ran directly and its service is healthy"
          pkill -f 'AURA' || true

      - name: Verify the NSIS installer installs and launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist-release/*.exe)[0].FullName
          # /S is NSIS silent mode; the installer is what a user double-clicks.
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep 5
          # Ask the installer where it put things rather than guessing. NSIS
          # writes an uninstall entry with InstallLocation, which is correct
          # whether the install was per-user or per-machine and whatever the
          # product is called. The filesystem sweep is only a fallback, and
          # both are reported so a failure here says what actually happened
          # instead of just "not found".
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                                    'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                                    'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' `
                   -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -match 'AURA' } | Select-Object -First 1
          if ($entry) { Write-Host "registry: $($entry.DisplayName) -> $($entry.InstallLocation)" }
          else { Write-Host 'registry: no uninstall entry matching AURA' }
          $roots = @($entry.InstallLocation, "$env:LOCALAPPDATA\Programs", "$env:LOCALAPPDATA",
                     "$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
                   Where-Object { $_ -and (Test-Path $_) }
          $app = Get-ChildItem $roots -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.BaseName -match 'AURA' } | Select-Object -First 1
          if (-not $app) {
            Write-Host '--- directories matching AURA under the searched roots ---'
            Get-ChildItem $roots -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'AURA' } | Select-Object -First 10 -ExpandProperty FullName
            throw 'NSIS installer placed no AURA executable anywhere searched'
          }
          Write-Host "installed to: $($app.FullName)"
          $env:AURA_HOME = "$env:RUNNER_TEMP\nsis-home"
          Start-Process -FilePath $app.FullName
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:4319/health | Out-Null; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw 'the installed application never brought its service up' }
          Write-Host 'OK: installed NSIS build launched and its service is healthy'
          $scan = Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Method POST -ContentType 'application/json' -Body '{}' http://127.0.0.1:4319/environment/scan
          $node = ($scan.Content | ConvertFrom-Json).results.node
          if (-not $node.present) { throw 'the installed application did not detect Node' }
          Write-Host "OK: detection through the installed app — node $($node.version)"
          Get-Process -Name $app.BaseName -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          # Uninstall through the uninstaller the installer itself wrote.
          $uninst = Join-Path $app.DirectoryName 'uninstall.exe'
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList '/S' -Wait
            Start-Sleep 5
            if (Test-Path $app.FullName) { Write-Host 'NOTE: uninstaller ran but the binary is still present' }
            else { Write-Host 'OK: uninstalled cleanly' }
          } else { Write-Host 'NOTE: no uninstall.exe written by the installer' }

      - name: Verify the DMG mounts, copies and launches (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          DMG=$(ls dist-release/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /Volumes/AURA -nobrowse -quiet
          cp -R "/Volumes/AURA/AURA Hub.app" "$RUNNER_TEMP/AURA Hub.app"
          hdiutil detach /Volumes/AURA -quiet
          echo "OK: DMG mounted and the .app copied out of it"
          AURA_HOME="$RUNNER_TEMP/dmg-home" AI_PORT=4319 "$RUNNER_TEMP/AURA Hub.app/Contents/MacOS/aura-hub" &
          for i in $(seq 1 60); do curl -sf -m 2 http://127.0.0.1:4319/health >/dev/null && break; sleep 2; done
          curl -sf -m 5 http://127.0.0.1:4319/health >/dev/null && echo "OK: the installed .app launched and its service is healthy"
          curl -sf -m 30 -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:4319/environment/scan \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const s=JSON.parse(d);if(!s.results.node?.present)process.exit(1);console.log('OK: detection through the installed app — node',s.results.node.version,'| git',s.results.git?.version)})"
          pkill -f 'aura-hub' || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Hub-${{ matrix.label }}
          if-no-files-found: error
          path: dist-release/*

  # Publishing. Deliberately a separate job with a separate trigger: the
  # artifacts above are built and verified on every push, and become an
  # update that installed copies will fetch only when a version tag says so.
  #
  # It waits for all four platform builds because `latest.json` is written
  # from all of them at once. A manifest missing a platform does not fail
  # loudly — those users simply stop receiving updates, and nobody notices
  # until a fix does not reach them. So a release is all four or none.
  release:
    name: Publish release
    needs: desktop-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # To create the release and upload assets. Nothing else is granted.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The verification step below bundles the client's own applicability
      # gate to check the manifest against it, so this job needs the
      # toolchain even though it compiles nothing.
      - name: Install dependencies
        run: npm ci

      # Every platform's staged output, merged into the one directory the
      # manifest generator reads.
      - name: Collect artifacts from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: AURA-Hub-*
          merge-multiple: true
          path: dist-release

      - name: Show what will be published
        run: ls -la dist-release

      # Refuses on a missing platform, a missing or empty signature, a
      # version that disagrees with tauri.conf.json, or two artifacts
      # claiming the same target.
      - name: Build the update manifest
        run: node scripts/build-latest-json.mjs --tag "${GITHUB_REF_NAME}"

      # The manifest is checked before it is published, not after. Once
      # `latest.json` is on the releases page, every installed copy of AURA
      # Hub will act on it within a check interval.
      - name: Verify the release
        run: node scripts/release-verify.mjs --tag "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AURA Hub $GITHUB_REF_NAME" \
            --generate-notes \
            dist-release/*
