[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA Hub canonical Python backend (migration target)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    # The canonical API IS a Starlette app served by uvicorn (aura/api/server.py).
    # Declared as runtime dependencies, not test extras: the desktop shell starts
    # this backend, so an installation without them is a backend that cannot run.
    #
    # Capped below Starlette 1.0: the suite runs against 0.37, and 1.x moves
    # TestClient onto a different HTTP client (`httpx2`), so resolving into it
    # would ship a lock nothing here has been run against. Lifting the cap is a
    # deliberate upgrade with its own test run, not a resolver's decision.
    "starlette>=0.37,<1",
    "uvicorn>=0.30",
    # Required by Starlette's request.form() for multipart/form-data uploads.
    # Without it the server starts fine but POST /documents/ingest returns 500.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Multimodal document ingestion (S6-S7).  Install with:
#   pip install aura-backend[multimodal]
# All dependencies are local-only; no cloud service is contacted during
# document processing.
multimodal = [
    "pypdf>=4",            # PDF text and metadata extraction (pure Python)
    "python-docx>=1.1",    # DOCX text extraction (pure Python)
    "pillow>=10",          # image loading and pre-processing
    # pytesseract is NOT listed here: it requires the Tesseract system binary
    # (tesseract-ocr package) which pip cannot install. Users who want OCR
    # must install Tesseract separately. AURA detects it at runtime and
    # enables the OCR path automatically if it is present.
]

# Real artifact generation (S10).  Install with:
#   pip install aura-backend[artifacts]
# All generation runs locally — no cloud rendering service.
artifacts = [
    "python-docx>=1.1",     # DOCX generation
    "openpyxl>=3.1",        # XLSX generation
    "reportlab>=4.2",       # PDF generation (pure Python, no LaTeX)
]

# Docling document intelligence (document_engine subsystem).  Install with:
#   pip install "aura-backend[docling]"
# Install CPU-only torch FIRST to avoid the large CUDA wheel:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch
# Then provision the model cache (one-time download, auditable manifest):
#   python scripts/provision-docling-models.py
# All conversion runs locally — no cloud OCR, VLM, or document service.
# Pinned to the version the subsystem was built and tested against;
# lifting the pin is a deliberate upgrade with its own test run.
docling = [
    "docling==2.130.0",     # pipeline, backends, chunking (MIT)
    "rapidocr-onnxruntime", # default local OCR engine (Apache-2.0)
    "odfdo",                # OpenDocument (.odt/.ods/.odp) backend
    # (Apache-2.0, verified from installed dist-info licenses/LICENSE)
    # NOTE: no easyocr (torch-heavy, Asian-language win only),
    # no tesserocr (needs system Tesseract all the same; CLI path
    # auto-detected at runtime when tesseract-ocr is installed).
]

test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.26",
    # `starlette.testclient` refuses to import without it, and the API suites
    # are built on TestClient — so a venv created from this extra alone could
    # not collect them. Declared here rather than assumed present.
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
norecursedirs = ["target", "node_modules", ".git", "__pycache__"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", "E402", "E702", "E731", "E741",
    "F841", "F601",
    "BLE001", "DTZ001", "PLR0124", "PLW1510",
    "FURB162", "ASYNC230", "UP035", "UP006", "UP017",
    "RUF022", "RUF100",
]
