[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA Hub canonical Python backend (migration target)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", "E402", "E702", "E731", "E741",
    "F841", "F601",
    "BLE001", "DTZ001", "PLR0124", "PLW1510",
    "FURB162", "ASYNC230", "UP035", "UP006", "UP017",
    "RUF022", "RUF100",
]
