[project]
name = "aura-backend"
version = "0.0.1"
description = "AURA Hub backend — Python implementation (parallel to the TypeScript reference)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["slow: exercises real tools and races real timeouts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Verification scripts and tests shell out to real tools on purpose; the
# return codes are inspected explicitly where they matter.
"tests/*" = ["PLW1510", "S603", "S607"]
"parity/*" = ["PLW1510", "S603", "S607", "SIM115"]
"verify/*" = ["PLW1510", "S603", "S607"]
