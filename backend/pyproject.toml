[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA Hub canonical Python backend (migration target)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.26",
]
lint = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Deliberate omissions: BLE001/S110 (contained excepts are a documented
# pattern here), RUF059 (test unpacking), COM (trailing commas are manual).
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["BLE001", "S110", "RUF059", "RUF012", "B008",
          "RUF002", "RUF003"]  # arrows in docs are house style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Parallel-builder-owned modules: mechanical findings left for their author
# to avoid churn/conflicts inside actively-developed migration code.
"aura/persistence/*" = ["B006", "E501"]
"aura/policy/*" = ["E501"]
"tests/differential/*" = ["B905"]
"tests/vectors/*" = ["E731"]
"tests/unit/test_approvals.py" = ["F841", "E702"]
"tests/unit/test_audit.py" = ["E741"]
