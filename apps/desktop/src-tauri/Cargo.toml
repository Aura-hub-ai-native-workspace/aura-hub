[package]
name = "aura-hub"
version = "0.1.0"
description = "AURA Hub — an AI Operating Environment"
authors = ["AURA"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app for the framework this wraps.
[lib]
name = "aura_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for SIGTERM on shutdown. `Child::kill` sends SIGKILL, which would
# deny the service the graceful close its SIGTERM handler performs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Objects, for the one thing Unix signals do that Windows has no
# equivalent of: killing the service when the shell dies unexpectedly.
# Pinned to the version Tauri already pulls in, so this adds no second
# copy of windows-sys to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
